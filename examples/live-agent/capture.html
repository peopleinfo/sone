<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Capture</title></head>
<body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh">
<script type="module">
try {
  const { render } = await import("sone");
  const { specToSoneNode } = await import("./src/spec-to-sone.ts");
  const { createRenderer } = await import("./src/renderer.ts");

  const params = new URLSearchParams(location.search);
  const message = params.get("message") || "";

  const res = await fetch("/api/agent/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message }),
  });

  const { spec } = await res.json();
  console.log("spec", JSON.stringify(spec));

  const renderer = createRenderer(2);
  const node = specToSoneNode(spec);
  const canvas = await render(node, renderer);
  canvas.id = "capture-canvas";
  canvas.style.maxWidth = "100%";
  document.body.appendChild(canvas);
  window.__captureReady = true;
  console.log("capture ready");
} catch (err) {
  console.error("capture error:", err);
  window.__captureError = err.message;
}
</script>
</body>
</html>
